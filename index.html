<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cayden's Shooting Lab</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131c2e;
      --card-hover: #182338;
      --accent: #f97316;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --header-bg: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 1400px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }
    .status-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; background: var(--card); border: 1px solid var(--border); color: var(--muted); }

    .stats-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 18px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 6px; text-align: center; }
    .stat-card .val { font-size: 1.25rem; font-weight: 700; color: #fff; margin-top: 2px; }
    .stat-card .label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; }

    .table-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; margin-bottom: 24px; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.78rem; white-space: nowrap; }
    th { background: var(--header-bg); color: var(--muted); padding: 10px 8px; font-weight: 600; border-bottom: 1px solid var(--border); }
    td { padding: 8px; border-bottom: 1px solid var(--border); }
    tr:hover { background: var(--card-hover); }
    .pts-highlight { color: #facc15; font-weight: 800; font-size: 0.9rem; }
    .highlight { color: var(--accent); font-weight: 700; }
    .green { color: var(--green); font-weight: 700; }
    .btn-del { background: transparent; border: 1px solid var(--red); color: var(--red); border-radius: 4px; padding: 2px 6px; font-size: 0.7rem; cursor: pointer; }
    .btn-del:hover { background: var(--red); color: #fff; }
    .empty-state { padding: 30px; color: var(--muted); text-align: center; }

    .panels-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 24px; }
    .panel-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .panel-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; color: var(--text); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
    .form-group label { display: block; font-size: 0.65rem; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; font-weight: 600; }
    .form-group input {
      width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 7px 8px; border-radius: 4px; font-size: 0.82rem; outline: none;
    }
    .submit-btn {
      margin-top: 14px; background: var(--accent); border: none; color: #fff; padding: 9px 20px; border-radius: 6px; font-weight: 700; cursor: pointer; transition: opacity 0.2s;
    }
    .submit-btn:hover { opacity: 0.9; }
    .tool-btn {
      background: #0f172a; border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: 600;
    }
    .tool-btn.danger:hover { color: var(--red); border-color: var(--red); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Cayden's Shooting Lab</h1>
        <p style="color: var(--muted); font-size: 0.8rem; margin-top: 2px;">Spot Shooting, Free Throws & Shoot-Around Scoring Game</p>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <span class="status-badge" id="sync-status">Connecting...</span>
        <button onclick="clearAllCache()" class="tool-btn danger">Wipe Cache</button>
      </div>
    </header>

    <!-- Top Summary Row -->
    <div class="stats-summary" id="stats-summary"></div>

    <!-- Shoot Around Sessions Table -->
    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Corner L (3PT)</th>
            <th>Wing L (3PT)</th>
            <th>Top (3PT)</th>
            <th>Wing R (3PT)</th>
            <th>Corner R (3PT)</th>
            <th>Total 3PT</th>
            <th>Mid L (2PT)</th>
            <th>Mid R (2PT)</th>
            <th>Total Mid</th>
            <th>FT (/50)</th>
            <th style="color:#facc15;">Total Points</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="sessions-body"></tbody>
      </table>
    </div>

    <!-- Log Session Panel -->
    <div class="panels-grid">
      <div class="panel-box">
        <div class="panel-title">Log New Shoot Around Session</div>
        <form id="session-form" onsubmit="handleFormSubmit(event)">
          <div class="form-grid">
            <div class="form-group"><label>Date</label><input type="date" id="s-date" required /></div>
            <div class="form-group"><label>Corner L (Made /20)</label><input type="number" id="s-c-left" min="0" max="20" placeholder="0" /></div>
            <div class="form-group"><label>Wing L (Made /20)</label><input type="number" id="s-w-left" min="0" max="20" placeholder="0" /></div>
            <div class="form-group"><label>Top (Made /20)</label><input type="number" id="s-top" min="0" max="20" placeholder="0" /></div>
            <div class="form-group"><label>Wing R (Made /20)</label><input type="number" id="s-w-right" min="0" max="20" placeholder="0" /></div>
            <div class="form-group"><label>Corner R (Made /20)</label><input type="number" id="s-c-right" min="0" max="20" placeholder="0" /></div>
            <div class="form-group"><label>Mid L (Made /25)</label><input type="number" id="s-mid-left" min="0" max="25" placeholder="0" /></div>
            <div class="form-group"><label>Mid R (Made /25)</label><input type="number" id="s-mid-right" min="0" max="25" placeholder="0" /></div>
            <div class="form-group"><label>Free Throws (Made /50)</label><input type="number" id="s-ft" min="0" max="50" placeholder="0" /></div>
          </div>
          <button type="submit" class="submit-btn">Save Session & Calculate Score</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyohR3lHHzpfkSIKLiKb7WFGHT0HiTHHcXkyyK-vwPOXnYygjVuqI4Zqnl4rWIc_yTfWQ/exec";

    let state = {
      sessions: []
    };

    function calculateSessionPoints(s) {
      const cL = Number(s.cornerLeft) || 0;
      const wL = Number(s.wingLeft) || 0;
      const top = Number(s.top) || 0;
      const wR = Number(s.wingRight) || 0;
      const cR = Number(s.cornerRight) || 0;
      const midL = Number(s.midLeft) || 0;
      const midR = Number(s.midRight) || 0;
      const ft = Number(s.ft) || 0;

      const total3Made = cL + wL + top + wR + cR;
      const totalMidMade = midL + midR;
      
      // 3 points for each 3PT make, 2 for each mid-range make, 1 for each free throw
      return (total3Made * 3) + (totalMidMade * 2) + (ft * 1);
    }

    async function loadData() {
      setStatus("Syncing from Drive...");
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        if (data && Array.isArray(data.sessions)) {
          state = data;
          localStorage.setItem('cayden_shooting_cache', JSON.stringify(state));
          setStatus("Synced with Drive");
        } else if (Array.isArray(data)) {
          state = { sessions: data };
          localStorage.setItem('cayden_shooting_cache', JSON.stringify(state));
          setStatus("Synced with Drive");
        } else {
          fallbackLocal("Synced with Drive (Empty)");
        }
      } catch (err) {
        fallbackLocal("Offline Mode");
      }
      render();
    }

    function fallbackLocal(msg) {
      const local = localStorage.getItem('cayden_shooting_cache');
      if (local) {
        try { state = JSON.parse(local); } catch(e){}
      }
      setStatus(msg);
    }

    async function saveData() {
      localStorage.setItem('cayden_shooting_cache', JSON.stringify(state));
      setStatus("Saving to Drive...");
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(state)
        });
        setStatus("Synced with Drive");
      } catch (err) {
        setStatus("Offline Mode");
      }
    }

    function setStatus(msg) {
      document.getElementById('sync-status').textContent = msg;
    }

    function clearAllCache() {
      if (confirm("Clear local storage cache and reload?")) {
        localStorage.removeItem('cayden_shooting_cache');
        location.reload();
      }
    }

    function deleteSession(idx) {
      if (confirm("Delete this shoot-around session?")) {
        state.sessions.splice(idx, 1);
        render();
        saveData();
      }
    }

    function render() {
      const tbody = document.getElementById('sessions-body');
      tbody.innerHTML = '';

      const sessions = state.sessions || [];
      if (sessions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="13" class="empty-state">No shoot-around sessions logged yet.</td></tr>`;
        document.getElementById('stats-summary').innerHTML = '';
        return;
      }

      let totals = {
        sessions: sessions.length,
        threeMade: 0,
        threeAtt: 0,
        midMade: 0,
        midAtt: 0,
        ftMade: 0,
        ftAtt: 0,
        totalPoints: 0,
        maxPoints: 0
      };

      sessions.forEach((s, idx) => {
        const cL = Number(s.cornerLeft) || 0;
        const wL = Number(s.wingLeft) || 0;
        const top = Number(s.top) || 0;
        const wR = Number(s.wingRight) || 0;
        const cR = Number(s.cornerRight) || 0;
        const total3Made = cL + wL + top + wR + cR;
        const total3Att = Number(s.total3Att) || 100; // default 20 per spot

        const midL = Number(s.midLeft) || 0;
        const midR = Number(s.midRight) || 0;
        const totalMidMade = midL + midR;
        const totalMidAtt = Number(s.totalMidAtt) || 50; // default 25 L / 25 R

        const ft = Number(s.ft) || 0;
        const ftAtt = Number(s.ftAtt) || 50;

        const sessionPts = calculateSessionPoints(s);

        totals.threeMade += total3Made;
        totals.threeAtt += total3Att;
        totals.midMade += totalMidMade;
        totals.midAtt += totalMidAtt;
        totals.ftMade += ft;
        totals.ftAtt += ftAtt;
        totals.totalPoints += sessionPts;
        if (sessionPts > totals.maxPoints) totals.maxPoints = sessionPts;

        const threePct = total3Att > 0 ? ((total3Made / total3Att) * 100).toFixed(1) + '%' : '-';
        const midPct = totalMidAtt > 0 ? ((totalMidMade / totalMidAtt) * 100).toFixed(1) + '%' : '-';
        const ftPct = ftAtt > 0 ? ((ft / ftAtt) * 100).toFixed(1) + '%' : '-';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${s.date || '-'}</td>
          <td>${cL}/20</td>
          <td>${wL}/20</td>
          <td>${top}/20</td>
          <td>${wR}/20</td>
          <td>${cR}/20</td>
          <td class="highlight">${total3Made}/${total3Att} (${threePct})</td>
          <td>${midL}/25</td>
          <td>${midR}/25</td>
          <td class="blue" style="color:var(--blue); font-weight:700;">${totalMidMade}/${totalMidAtt} (${midPct})</td>
          <td class="green">${ft}/${ftAtt} (${ftPct})</td>
          <td class="pts-highlight">${sessionPts} pts</td>
          <td><button class="btn-del" onclick="deleteSession(${idx})">✕</button></td>
        `;
        tbody.appendChild(tr);
      });

      const n = totals.sessions;
      const overall3Pct = totals.threeAtt > 0 ? ((totals.threeMade / totals.threeAtt) * 100).toFixed(1) + '%' : '0.0%';
      const overallMidPct = totals.midAtt > 0 ? ((totals.midMade / totals.midAtt) * 100).toFixed(1) + '%' : '0.0%';
      const overallFtPct = totals.ftAtt > 0 ? ((totals.ftMade / totals.ftAtt) * 100).toFixed(1) + '%' : '0.0%';
      const avgPts = (totals.totalPoints / n).toFixed(1);

      document.getElementById('stats-summary').innerHTML = `
        <div class="stat-card"><div class="label">Sessions</div><div class="val">${n}</div></div>
        <div class="stat-card"><div class="label">Avg Score</div><div class="val" style="color:#facc15;">${avgPts}</div></div>
        <div class="stat-card"><div class="label">High Score</div><div class="val" style="color:#facc15;">${totals.maxPoints}</div></div>
        <div class="stat-card"><div class="label">Overall 3PT%</div><div class="val" style="color:var(--accent);">${overall3Pct}</div></div>
        <div class="stat-card"><div class="label">Overall Mid%</div><div class="val" style="color:var(--blue);">${overallMidPct}</div></div>
        <div class="stat-card"><div class="label">Overall FT%</div><div class="val" style="color:var(--green);">${overallFtPct}</div></div>
      `;
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const newSession = {
        date: document.getElementById('s-date').value,
        cornerLeft: Number(document.getElementById('s-c-left').value) || 0,
        wingLeft: Number(document.getElementById('s-w-left').value) || 0,
        top: Number(document.getElementById('s-top').value) || 0,
        wingRight: Number(document.getElementById('s-w-right').value) || 0,
        cornerRight: Number(document.getElementById('s-c-right').value) || 0,
        total3Att: 100,
        midLeft: Number(document.getElementById('s-mid-left').value) || 0,
        midRight: Number(document.getElementById('s-mid-right').value) || 0,
        totalMidAtt: 50,
        ft: Number(document.getElementById('s-ft').value) || 0,
        ftAtt: 50
      };

      state.sessions.unshift(newSession);
      render();
      saveData();
      e.target.reset();
    }

    loadData();
  </script>
</body>
</html>
